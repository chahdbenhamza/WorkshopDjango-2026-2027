{% extends 'vehicules/base.html' %}

{% block title %}Offre - TransConnect{% endblock %}

{% block content %}
<section class="form-panel">
    <p class="eyebrow">GESTION DES OFFRES</p>
    <h1>{% if form.instance.pk %}Modifier l'offre #{{ form.instance.pk }}{% else %}Déposer une offre{% endif %}</h1>
    <form method="post" class="vehicle-form">
        {% csrf_token %}
        {{ form.as_p }}
        <div class="form-actions">
            <button class="button button-primary" type="submit">Enregistrer</button>
            <a class="button button-secondary" href="{% url 'offres:list' %}">Annuler</a>
        </div>
    </form>
</section>
{% endblock %}
